name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run pytest with coverage
        run: pytest -v --cov=analytics_copilot --cov-report=term-missing

  eval:
    name: LLM eval harness (needs GROQ_API_KEY secret)
    runs-on: ubuntu-latest
    needs: test
    # Secrets are not available to fork PRs; the steps below skip cleanly
    # when the key is absent.
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Check for API key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY not set; skipping eval harness."
          fi

      - name: Check out repository
        if: env.GROQ_API_KEY != ''
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.GROQ_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run eval harness
        if: env.GROQ_API_KEY != ''
        run: python -m analytics_copilot.evals --min-accuracy 0.8 --out-dir evals/reports

      - name: Upload eval report
        if: env.GROQ_API_KEY != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/
          if-no-files-found: ignore
