- id: q004
  question: What is the total revenue from delivered orders?
  tags:
  - aggregation
  - join
  - filter
  difficulty: medium
  reference_sql: "SELECT ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue\n \
    \           FROM order_items oi\n            JOIN orders o ON oi.order_id = o.order_id\n\
    \            WHERE o.status = 'delivered';"
  expected_rows:
  - - 56399.34
  ordered: false
- id: q005
  question: Which country has the most customers?
  tags:
  - group-by
  - order-by
  - limit
  difficulty: medium
  reference_sql: "SELECT country, COUNT(*) AS n\n            FROM customers\n    \
    \        GROUP BY country\n            ORDER BY n DESC, country ASC\n        \
    \    LIMIT 1;"
  expected_rows:
  - - USA
    - 4
  ordered: true
- id: q006
  question: How much revenue did each product category generate from delivered orders?
  tags:
  - group-by
  - join
  - aggregation
  - filter
  difficulty: medium
  reference_sql: "SELECT p.category, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS\
    \ revenue\n            FROM order_items oi\n            JOIN orders   o ON oi.order_id\
    \   = o.order_id\n            JOIN products p ON oi.product_id = p.product_id\n\
    \            WHERE o.status = 'delivered'\n            GROUP BY p.category\n \
    \           ORDER BY p.category;"
  expected_rows:
  - - Apparel
    - 9798.0
  - - Books
    - 2284.49
  - - Electronics
    - 10024.32
  - - Home Goods
    - 23305.03
  - - Outdoor
    - 10987.5
  ordered: true
- id: q007
  question: Who are the top 3 customers by total spend on delivered orders?
  tags:
  - join
  - group-by
  - order-by
  - limit
  difficulty: hard
  reference_sql: "SELECT c.name, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS spend\n\
    \            FROM customers c\n            JOIN orders      o  ON c.customer_id\
    \ = o.customer_id\n            JOIN order_items oi ON o.order_id    = oi.order_id\n\
    \            WHERE o.status = 'delivered'\n            GROUP BY c.customer_id,\
    \ c.name\n            ORDER BY spend DESC, c.name ASC\n            LIMIT 3;"
  expected_rows:
  - - Isabel Santos
    - 12226.26
  - - Bob Martinez
    - 6910.42
  - - Daniel Okoye
    - 6104.91
  ordered: true
