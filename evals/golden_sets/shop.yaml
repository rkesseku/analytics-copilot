- id: q009
  question: What is the average order value among delivered orders?
  tags:
  - aggregation
  - join
  - subquery
  difficulty: hard
  reference_sql: "SELECT ROUND(AVG(order_total), 2) AS avg_order_value\n         \
    \   FROM (\n                SELECT o.order_id, SUM(oi.quantity * oi.unit_price)\
    \ AS order_total\n                FROM orders o\n                JOIN order_items\
    \ oi ON o.order_id = oi.order_id\n                WHERE o.status = 'delivered'\n\
    \                GROUP BY o.order_id\n            ) t;"
  expected_rows:
  - - 640.9
  ordered: false
